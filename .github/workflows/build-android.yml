name: Build Android APK/AAB

# Hanya jalan lewat tag versi (v*) atau dipicu manual - BUKAN tiap commit ke
# main, konsisten dgn pola auto-update Presensi.exe (al-ikhlas86/presensi).
# Self-hosted (expo prebuild + Gradle langsung, BUKAN EAS Build) - tidak ada
# limit build bulanan, tidak perlu akun Expo. Lihat catatan lengkap di
# plugins/withReleaseSigning.js utk kenapa signing rilis dibuat begini.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  # Dibutuhkan langkah "Bersihkan artefak build lama" di bawah (menghapus
  # artefak = menulis ke Actions, bukan ke repo).
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # versionCode Android WAJIB naik terus tiap upload ke Play Store -
      # pakai nomor run GitHub Actions (selalu unik & naik) drpd hardcode 1
      # di app.json.
      - name: Set Android versionCode from run number
        run: |
          node -e "
            const fs = require('fs');
            const path = 'app.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.expo.android = config.expo.android || {};
            config.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
            console.log('versionCode set to ${{ github.run_number }}');
          "

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Expo prebuild (generate android/ native project)
        run: npx expo prebuild --platform android --clean

      # expo-notifications & @react-native-firebase/messaging sama-sama
      # mendeklarasikan meta-data notification color di AndroidManifest.xml -
      # manifest merger gagal tanpa ini (ketemu di build pertama 2026-09-02).
      # Dijalankan sbg langkah terpisah SETELAH prebuild 100% selesai - lihat
      # catatan lengkap kenapa ini TIDAK bisa jadi config plugin biasa di
      # scripts/fix-android-manifest.js.
      - name: Fix Firebase notification color manifest conflict
        run: node scripts/fix-android-manifest.js

      - name: Build release APK + AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Clean up decoded secrets
        if: always()
        run: rm -f google-services.json release.keystore

      # retention-days DITAMBAHKAN EKSPLISIT 2026-09-11 (sebelumnya tidak diisi
      # sama sekali, mengandalkan default akun/repo) - ditemukan run #13/#14/#15
      # (dibuat 2026-09-04/05) SEMUA sudah 0 artifact lagi per 2026-09-11 (baru
      # ~6 hari), jauh lebih cepat dari default 90 hari GitHub - kemungkinan
      # besar ada pengaturan retensi default akun yang lebih pendek dari
      # perkiraan. Link unduh APK langsung di
      # https://alikhlas86.duckdns.org/al-ikhlas-86.apk TIDAK terpengaruh (lihat
      # step "Deploy APK to VPS" di bawah - terpisah total dari GitHub
      # Artifacts), tapi AAB (utk upload ke Play Store) HANYA ada di sini, jadi
      # tetap butuh retensi yang jelas & cukup panjang.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: al-ikhlas-86-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: al-ikhlas-86-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Supaya link https://alikhlas86.duckdns.org/al-ikhlas-86.apk SELALU
      # unduh APK terbaru tanpa lewat GitHub Artifacts (yg selalu dibungkus
      # ZIP) - kirim langsung ke VPS lewat SSH key khusus yg di sisi server
      # DIPAKSA (authorized_keys command=) cuma bisa jalankan 1 skrip
      # /usr/local/bin/deploy-mobile-apk.sh, tidak bisa buka shell / akses
      # file lain sama sekali (dibuat & diuji 2026-09-02).
      - name: Deploy APK to VPS for direct download link
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          cat android/app/build/outputs/apk/release/app-release.apk | ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=accept-new ubuntu@168.110.196.103
          rm -f ~/.ssh/vps_deploy_key

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      # Artefak build MEMAKAN KUOTA STORAGE GitHub Actions - repo ini privat,
      # jadi kena jatah akun (paket Free: 500 MB, gabungan LINTAS SEMUA repo
      # privat di akun ini, bukan per-repo - dikonfirmasi 2026-09-02 lewat
      # github.com/settings/billing). 1 build = APK ~34 MB + AAB ~45 MB =
      # ~80 MB. Dibiarkan menumpuk, 4 build saja sudah 318 MB.
      #
      # REVISI 2026-09-02 (permintaan user): sebelumnya cuma menghapus
      # ARTEFAK-nya (riwayat run/log tetap menumpuk selamanya di tab
      # Actions). Sekarang menghapus RUN-nya SEKALIAN - satu paket dgn
      # log & artefaknya - supaya daftar run juga tetap rapi 3 terbaru,
      # bukan cuma isinya yang kosong tapi barisnya numpuk terus.
      #
      # KEAMANAN dibuktikan LANGSUNG (bukan dari dokumentasi saja) sebelum
      # dipasang: repo mobile-app TIDAK PERNAH punya git tag/GitHub Release
      # sama sekali (semua build lewat workflow_dispatch) - dicek via
      # `gh api repos/.../releases` & `.../tags` = 0 keduanya. Jadi
      # menghapus run di sini TIDAK MUNGKIN menyentuh Release apa pun.
      # Link unduh https://alikhlas86.duckdns.org/al-ikhlas-86.apk adalah
      # file terpisah di VPS, juga tidak tersentuh.
      #
      # if: always() supaya pembersihan tetap jalan walau langkah deploy di
      # atas sempat gagal - justru saat build bermasalah storage paling
      # gampang menumpuk.
      # KOREKSI 2026-09-11 (revisi ke-2, bug NYATA - lihat catatan lengkap di
      # build.yml DataMaster): run yang SEDANG menjalankan step ini SENDIRI
      # belum berstatus "completed" di API saat query jalan, jadi tidak pernah
      # terhitung - `tail -n +3` (skip 2) membuat steady-state-nya jadi 3 run
      # tersisa, bukan 2. Diperkecil ke `tail -n +2` (skip 1). Dikonfirmasi
      # nyata 2026-09-11: repo ini masih tampil run #13/#14/#15 (3 run)
      # sebelum perbaikan ini, persis sesuai analisa.
      - name: Bersihkan run build lama (simpan 2 terbaru)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/build-android.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +2 | awk '{print $2}' \
            | while read -r id; do
                echo "hapus run lama id=$id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done
